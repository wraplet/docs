<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<div class="container">
    <div data-js-calculator class="row g-3">
        <div class="col-sm-4">
            <label>Number #1: <input data-js-calculator-number type="number" class="form-control" value="1"></label>
        </div>
        <div class="col-sm-4">
            <label>Number #2: <input data-js-calculator-number type="number" class="form-control" value="2"></label>
        </div>
        <div class="col-sm-4">
             <label>Result: <input data-js-calculator-result type="number" class="form-control" disabled></label>
        </div>
        <div class="col-sm-4">
            <button data-js-calculator-calculate class="btn btn-primary">Calculate</button>
        </div>
    </div>
</div>
