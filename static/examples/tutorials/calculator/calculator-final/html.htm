<div data-js-calculator>
    <div>
        <label>Number #1:
            <input
                data-js-calculator-number type="number" value="1"
            >
        </label>
    </div>
    <div>
        <label>
            Number #2:
            <input
                data-js-calculator-number type="number" value="2"
            >
        </label>
    </div>
    <div>

            <input
                data-js-calculator-result type="number" disabled
            >
        </label>
    </div>
    <div>
        <button data-js-calculator-calculate>
            Calculate
        </button>
    </div>
</div>
